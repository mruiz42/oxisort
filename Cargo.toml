[package]
name = "oxisort"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Sort photos and videos into date-based folders, fast (a Rust redesign inspired by phockup)"
publish = false

[lib]
name = "oxisort"
path = "src/lib.rs"

[[bin]]
name = "oxisort"
path = "src/main.rs"

# Exact pins (see docs/01-investigation.md, Finding 1, and docs/02-plan.md).
[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
rayon = "=1.12.0"
walkdir = "=2.5.0"
nom-exif = "=3.8.0"
kamadak-exif = "=0.6.2"
infer = "=0.22.0"
chrono = "=0.4.45"
regex = "=1.13.1"
blake3 = "=1.8.7"
indicatif = "=0.18.6"
log = "=0.4.35"
anyhow = "=1.0.104"
thiserror = "=2.0.21"
libc = "=0.2.191"

[dev-dependencies]
assert_cmd = "=2.2.2"
tempfile = "=3.27.0"
predicates = "=3.1.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

name: Release

# Tags build and publish a GitHub release. Pull requests that touch this file
# and manual runs build, test and smoke-test every target without publishing,
# so the packaging path is proven before a tag exists.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binaries run on any Linux (old glibc, Alpine).
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-15-intel,   target: x86_64-apple-darwin }
          - { os: macos-latest,     target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # blake3 compiles C/assembly through cc, which needs musl-gcc.
      - name: Install musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # Test the target that ships, not the host's default target.
      - run: cargo test --locked --release --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Check static linking
        if: contains(matrix.target, 'musl')
        run: |
          file "target/${{ matrix.target }}/release/oxisort"
          file "target/${{ matrix.target }}/release/oxisort" | grep -Eq 'statically linked|static-pie linked'
      - name: Smoke test in Alpine and Debian 11
        if: contains(matrix.target, 'musl')
        run: |
          bin="$PWD/target/${{ matrix.target }}/release/oxisort"
          for image in alpine:3 debian:11; do
            echo "::group::$image"
            docker run --rm --user 1000:1000 \
              -v "$bin:/oxisort:ro" -v "$PWD/tests/fixtures:/fx:ro" \
              "$image" sh -c '/oxisort --version && /oxisort -n --tz UTC /fx /tmp/out'
            echo "::endgroup::"
          done
      - name: Package
        shell: bash
        run: |
          # On a PR, GITHUB_REF_NAME is "N/merge", whose slash breaks the
          # archive name, so untagged builds are named after the commit.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          name="oxisort-${version}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/oxisort" README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: oxisort-*.tar.gz*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
